# Fetches Dispatch's feeds on GitHub's servers every 30 minutes and publishes them as
# feeds.json on the feed-data branch, where the app reads them without a CORS proxy.
name: Fetch feeds

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [content.js, extra-feeds.txt, scripts/fetch-feeds.mjs]

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch feeds
        run: mkdir -p out && node scripts/fetch-feeds.mjs out/feeds.json
      - name: Publish to the feed-data branch
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b feed-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.json
          git commit -q -m "Feed snapshot"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feed-data
